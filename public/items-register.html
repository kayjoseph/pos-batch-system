<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Register Item - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">
        <h1>Register Item</h1>

        <div class="card" style="max-width:480px;">
            <div class="form-row">
                <label>Name</label><input id="name" placeholder="e.g. Paracetamol 500mg" style="flex:1;">
            </div>
            <div class="form-row">
                <label>SKU</label><input id="sku" placeholder="optional - auto-generated if left blank" style="flex:1;">
            </div>
            <div class="form-row">
                <label>Category</label>
                <select id="category" style="flex:1;">
                    <option value="">-- none --</option>
                </select>
            </div>
            <p style="font-size:12px; color:var(--text-muted); margin:-4px 0 12px 128px;">
                Don't see the category you need? <a href="categories.html">Add one here</a> first.
            </p>
            <button onclick="createItem()">Save Item</button>
        </div>
    </main>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('items-register');

async function init() {
    const categories = await api('/categories');
    const select = document.getElementById('category');
    select.innerHTML = '<option value="">-- none --</option>' +
        categories.map(c => `<option value="${c.category_id}">${c.name}</option>`).join('');
}

async function createItem() {
    const name = document.getElementById('name').value.trim();
    const sku = document.getElementById('sku').value.trim();
    const categoryValue = document.getElementById('category').value;
    const category_id = categoryValue ? Number(categoryValue) : null;
    if (!name) return toast('Item name is required');
    try {
        await api('/items', { method: 'POST', body: JSON.stringify({ name, sku, category_id }) });
        // Same pattern as the batch view redirect - land on the list right after saving
        window.location.href = 'items.html';
    } catch (err) {
        toast(err.message);
    }
}

init();
</script>
</body>
</html>
