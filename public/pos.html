<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="items.html">Items</a>
    <a href="purchase.html">Purchase</a>
    <a href="pos.html">POS</a>
    <a href="sales.html">Sales</a>
</nav>
<div class="container">
    <h1>POS</h1>

    <div class="card">
        <div class="form-row">
            <label>Item</label>
            <select id="itemSelect"></select>
            <label>Qty</label>
            <input type="number" id="qtyInput" value="1" style="width:70px">
            <button onclick="addToCart()">Add to Cart</button>
        </div>
        <p style="font-size:12px; color:#666;">
            By default the oldest batch (FIFO) is used automatically. Use "Change Batch" on a cart line
            if the customer wants a specific batch.
        </p>
    </div>

    <div class="card">
        <table>
            <thead>
                <tr><th>Item</th><th>Batch</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th></tr>
            </thead>
            <tbody id="cartBody"></tbody>
        </table>
        <h2>Total: <span id="cartTotal">0.00</span></h2>
    </div>

    <div class="card">
        <div class="form-row">
            <label>Invoice No.</label><input id="invoiceNo" placeholder="e.g. INV-1001">
        </div>
        <div class="form-row">
            <label>Amount Paid</label><input id="amountPaid" type="number" step="0.01" value="0">
        </div>
        <button onclick="checkout()">Complete Sale</button>
    </div>
</div>

<!-- Batch picker modal -->
<div id="batchModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.4);">
    <div class="card" style="max-width:500px; margin:80px auto;">
        <h2 style="font-size:15px;">Choose a Batch</h2>
        <table>
            <thead><tr><th>Ref No.</th><th>Expiry</th><th>Remaining</th><th>Price</th><th></th></tr></thead>
            <tbody id="batchModalBody"></tbody>
        </table>
        <button class="secondary" onclick="closeBatchModal()">Cancel</button>
    </div>
</div>

<div id="toast"></div>
<script src="js/common.js"></script>
<script>
let items = [];
let cart = []; // { cart_key, item_id, item_name, qty, mode, batch_id, unit_price (display only, resolved server-side) }
let cartKeyCounter = 0;
let modalTargetKey = null;

async function init() {
    items = await api('/items');
    document.getElementById('itemSelect').innerHTML = items.map(i => `<option value="${i.item_id}">${i.name}</option>`).join('');
}

function addToCart() {
    const itemId = Number(document.getElementById('itemSelect').value);
    const qty = Number(document.getElementById('qtyInput').value);
    const item = items.find(i => i.item_id === itemId);
    if (!qty || qty <= 0) return toast('Enter a valid quantity');

    cart.push({
        cart_key: cartKeyCounter++,
        item_id: itemId,
        item_name: item.name,
        qty,
        mode: 'fifo',
        batch_id: null,
        batch_label: 'Auto (FIFO)',
    });
    renderCart();
}

function renderCart() {
    const body = document.getElementById('cartBody');
    body.innerHTML = cart.map(line => `
        <tr>
            <td>${line.item_name}</td>
            <td>${line.batch_label}</td>
            <td>${line.qty}</td>
            <td colspan="2"><em>calculated at checkout</em></td>
            <td>
                <button class="secondary" onclick="openBatchModal(${line.cart_key})">Change Batch</button>
                <button class="danger" onclick="removeCartLine(${line.cart_key})">X</button>
            </td>
        </tr>
    `).join('') || '<tr><td colspan="6">Cart is empty</td></tr>';
}

function removeCartLine(key) {
    cart = cart.filter(l => l.cart_key !== key);
    renderCart();
}

async function openBatchModal(cartKey) {
    const line = cart.find(l => l.cart_key === cartKey);
    modalTargetKey = cartKey;
    const batches = await api(`/sales/available-batches/${line.item_id}`);
    const body = document.getElementById('batchModalBody');
    body.innerHTML = batches.map(b => `
        <tr>
            <td>${b.batch_ref_no}</td>
            <td class="${expiryClass(b.expiry_date)}">${b.expiry_date ? b.expiry_date.substring(0,10) : '-'}</td>
            <td>${b.qty_remaining}</td>
            <td>${b.selling_price}</td>
            <td><button onclick="pickBatch(${b.batch_id}, '${b.batch_ref_no}')">Select</button></td>
        </tr>
    `).join('') || '<tr><td colspan="5">No stock available for this item</td></tr>';
    document.getElementById('batchModal').style.display = 'block';
}

function pickBatch(batchId, refNo) {
    const line = cart.find(l => l.cart_key === modalTargetKey);
    line.mode = 'manual';
    line.batch_id = batchId;
    line.batch_label = `Batch ${refNo}`;
    closeBatchModal();
    renderCart();
}

function closeBatchModal() {
    document.getElementById('batchModal').style.display = 'none';
    modalTargetKey = null;
}

async function checkout() {
    const invoice_no = document.getElementById('invoiceNo').value.trim();
    const amount_paid = Number(document.getElementById('amountPaid').value) || 0;
    if (!invoice_no) return toast('Invoice number is required');
    if (cart.length === 0) return toast('Cart is empty');

    const payload = {
        invoice_no,
        amount_paid,
        cart: cart.map(l => ({ item_id: l.item_id, qty: l.qty, mode: l.mode, batch_id: l.batch_id })),
    };

    try {
        const result = await api('/sales', { method: 'POST', body: JSON.stringify(payload) });
        toast(`Sale completed - total ${result.sale.total}`);
        cart = [];
        renderCart();
        document.getElementById('invoiceNo').value = '';
        document.getElementById('amountPaid').value = 0;
    } catch (err) {
        toast(err.message);
    }
}

init();
renderCart();
</script>
</body>
</html>
