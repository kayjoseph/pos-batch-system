<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Customers - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
            <h1 style="margin:0;">Customers</h1>
            <button onclick="openAddModal()">+ Register Customer</button>
        </div>

        <table>
            <thead>
                <tr><th>Code</th><th>Name</th><th>Phone</th><th>Address</th><th>Opening Bal.</th><th></th></tr>
            </thead>
            <tbody id="customersBody"></tbody>
        </table>
    </main>
</div>

<!-- Add Customer modal -->
<div id="addModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,20,28,0.5);">
    <div class="card" style="max-width:400px; margin:90px auto;">
        <h2 class="section-title">Register Customer</h2>
        <div class="form-row">
            <label>Name *</label><input id="newName" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Phone</label><input id="newPhone" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Address</label><input id="newAddress" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Opening Bal.</label><input id="newBalance" type="number" step="0.01" value="0" style="width:130px;">
        </div>
        <p style="font-size:12px; color:var(--text-muted); margin:-4px 0 12px 128px;">
            Negative = customer has an advance/credit. Positive = customer owes this amount.
        </p>
        <button onclick="saveCustomer()">Save</button>
        <button class="secondary" onclick="closeAddModal()">Cancel</button>
    </div>
</div>

<!-- Edit Customer modal -->
<div id="editModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,20,28,0.5);">
    <div class="card" style="max-width:400px; margin:90px auto;">
        <h2 class="section-title">Edit Customer</h2>
        <div class="form-row">
            <label>Name *</label><input id="editName" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Phone</label><input id="editPhone" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Address</label><input id="editAddress" style="flex:1;">
        </div>
        <div class="form-row">
            <label>Opening Bal.</label><input id="editBalance" type="number" step="0.01" style="width:130px;">
        </div>
        <button onclick="submitEdit()">Save</button>
        <button class="secondary" onclick="closeEditModal()">Cancel</button>
    </div>
</div>

<!-- Delete confirm modal -->
<div id="deleteModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,20,28,0.5);">
    <div class="card" style="max-width:360px; margin:120px auto; text-align:center;">
        <p style="font-size:14px; margin-bottom:18px;">Are you sure you want to delete Record</p>
        <button class="danger" onclick="confirmDelete()">Yes</button>
        <button class="secondary" onclick="closeDeleteModal()">Cancel</button>
    </div>
</div>

<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('customers');

let customers = [];
let editTargetId = null;
let deleteTargetId = null;

async function loadCustomers() {
    customers = await api('/customers');
    renderCustomers();
}

function renderCustomers() {
    const body = document.getElementById('customersBody');
    if (customers.length === 0) {
        body.innerHTML = `<tr><td colspan="6"><div class="empty-state">No customers yet.</div></td></tr>`;
        return;
    }
    body.innerHTML = customers.map(c => `
        <tr>
            <td class="mono">${c.customer_code}</td>
            <td>${c.name}${c.is_default ? ' <span class="badge partial">default</span>' : ''}</td>
            <td class="mono">${c.phone || '-'}</td>
            <td>${c.address || '-'}</td>
            <td class="mono">${c.opening_balance}</td>
            <td>
                <div class="action-menu-wrap">
                    <button class="secondary" onclick="toggleActionMenu(${c.customer_id})">Action &#9662;</button>
                    <div class="action-menu" id="action-menu-${c.customer_id}">
                        <div class="action-menu-item" onclick="openEditModal(${c.customer_id})">Update Details</div>
                        ${c.is_default
                            ? `<div class="action-menu-item disabled">Delete</div>`
                            : `<div class="action-menu-item danger" onclick="openDeleteModal(${c.customer_id})">Delete</div>`}
                    </div>
                </div>
            </td>
        </tr>
    `).join('');
}

function toggleActionMenu(id) {
    const menu = document.getElementById(`action-menu-${id}`);
    const isOpen = menu.classList.contains('open');
    document.querySelectorAll('.action-menu.open').forEach(m => m.classList.remove('open'));
    if (!isOpen) menu.classList.add('open');
}

function closeAllActionMenus() {
    document.querySelectorAll('.action-menu.open').forEach(m => m.classList.remove('open'));
}

document.addEventListener('click', (e) => {
    if (!e.target.closest('.action-menu-wrap')) closeAllActionMenus();
});

// ============ Add ============
function openAddModal() {
    document.getElementById('newName').value = '';
    document.getElementById('newPhone').value = '';
    document.getElementById('newAddress').value = '';
    document.getElementById('newBalance').value = 0;
    document.getElementById('addModal').style.display = 'block';
}
function closeAddModal() {
    document.getElementById('addModal').style.display = 'none';
}
async function saveCustomer() {
    const name = document.getElementById('newName').value.trim();
    const phone = document.getElementById('newPhone').value.trim();
    const address = document.getElementById('newAddress').value.trim();
    const opening_balance = Number(document.getElementById('newBalance').value) || 0;
    if (!name) return toast('Customer name is required');
    try {
        await api('/customers', { method: 'POST', body: JSON.stringify({ name, phone, address, opening_balance }) });
        toast('Customer registered');
        closeAddModal();
        loadCustomers();
    } catch (err) {
        toast(err.message);
    }
}

// ============ Edit ============
function openEditModal(id) {
    closeAllActionMenus();
    const c = customers.find(x => x.customer_id === id);
    editTargetId = id;
    document.getElementById('editName').value = c.name;
    document.getElementById('editPhone').value = c.phone || '';
    document.getElementById('editAddress').value = c.address || '';
    document.getElementById('editBalance').value = c.opening_balance;
    document.getElementById('editModal').style.display = 'block';
}
function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    editTargetId = null;
}
async function submitEdit() {
    const name = document.getElementById('editName').value.trim();
    const phone = document.getElementById('editPhone').value.trim();
    const address = document.getElementById('editAddress').value.trim();
    const opening_balance = Number(document.getElementById('editBalance').value) || 0;
    if (!name) return toast('Customer name is required');
    try {
        await api(`/customers/${editTargetId}`, { method: 'PUT', body: JSON.stringify({ name, phone, address, opening_balance }) });
        toast('Customer updated');
        closeEditModal();
        loadCustomers();
    } catch (err) {
        toast(err.message);
    }
}

// ============ Delete ============
function openDeleteModal(id) {
    closeAllActionMenus();
    deleteTargetId = id;
    document.getElementById('deleteModal').style.display = 'block';
}
function closeDeleteModal() {
    document.getElementById('deleteModal').style.display = 'none';
    deleteTargetId = null;
}
async function confirmDelete() {
    try {
        const result = await api(`/customers/${deleteTargetId}`, { method: 'DELETE' });
        toast(result.message || 'Customer deleted successfully!');
        closeDeleteModal();
        loadCustomers();
    } catch (err) {
        closeDeleteModal();
        toast(err.message);
    }
}

loadCustomers();
</script>
</body>
</html>
