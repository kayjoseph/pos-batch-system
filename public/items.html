<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Items - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">
        <h1>Items</h1>

        <div class="list-filter-bar">
            <div class="field">
                <label>Search</label>
                <input id="filterQuery" placeholder="Search by item code or name..." oninput="applyFilters()">
            </div>
            <button class="secondary" onclick="clearFilters()">Clear</button>
        </div>

        <table>
            <thead>
                <tr><th>Item Code</th><th>Name</th><th>Category</th><th>Total Stock</th><th>Actions</th></tr>
            </thead>
            <tbody id="itemsBody"></tbody>
        </table>
    </main>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('items-list');

let items = [];

async function loadItems() {
    items = await api('/items');
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('filterQuery').value.trim().toLowerCase();
    const filtered = query
        ? items.filter(i =>
            (i.sku || '').toLowerCase().includes(query) || i.name.toLowerCase().includes(query))
        : items;
    renderItems(filtered);
}

function clearFilters() {
    document.getElementById('filterQuery').value = '';
    applyFilters();
}

function renderItems(list) {
    const body = document.getElementById('itemsBody');
    if (items.length === 0) {
        body.innerHTML = `<tr><td colspan="5"><div class="empty-state">No items yet. <a href="items-register.html">Register your first item</a>.</div></td></tr>`;
        return;
    }
    if (list.length === 0) {
        body.innerHTML = `<tr><td colspan="5"><div class="empty-state">No items match this search.</div></td></tr>`;
        return;
    }
    body.innerHTML = list.map(i => `
        <tr>
            <td class="mono">${i.sku}</td>
            <td>${i.name}</td>
            <td>${i.category || '-'}</td>
            <td class="mono">${i.total_stock}</td>
            <td>
                <button class="secondary" onclick="location.href='batches.html?item_id=${i.item_id}&name=${encodeURIComponent(i.name)}'">View Batches</button>
                <button class="danger" onclick="deleteItem(${i.item_id})">Delete</button>
            </td>
        </tr>
    `).join('');
}

async function deleteItem(id) {
    if (!confirm('Delete this item?')) return;
    try {
        await api(`/items/${id}`, { method: 'DELETE' });
        toast('Item deleted');
        loadItems();
    } catch (err) {
        toast(err.message);
    }
}

loadItems();
</script>
</body>
</html>
