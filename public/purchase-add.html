<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Add Purchase - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">

        <div class="card">
            <div class="form-row">
                <label>Supplier</label><input id="supplier" value="General Supplier" style="flex:1;">
            </div>
            <div class="form-row">
                <label>Status</label>
                <select id="status">
                    <option value="received">Received - stock updates now</option>
                    <option value="lpo">LPO (Order) - stock updates once received</option>
                </select>
            </div>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <h2 class="section-title" style="margin:0;">Purchase Lines</h2>
                <button class="secondary" onclick="addLine()">+ Add Line</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Item</th><th>Qty</th><th>Cost Price</th><th>Selling Price</th>
                        <th>Batch Ref No.</th><th>Expiry Date</th><th></th>
                    </tr>
                </thead>
                <tbody id="linesBody">
                    <tr id="emptyLinesRow"><td colspan="7"><div class="empty-state">No lines yet - click "+ Add Line" to start.</div></td></tr>
                </tbody>
            </table>
        </div>

        <div class="card">
            <strong>Subtotal: <span class="mono" id="subtotal">0.00</span></strong>
            <div class="form-row" style="margin-top:14px;">
                <label>Amount Paid</label><input id="amountPaid" type="number" step="0.01" value="0" style="width:120px;">
            </div>
            <div class="form-row">
                <label>Payment Method</label>
                <select id="paymentMethod">
                    <option value="">-- none yet --</option>
                    <option value="cash">Cash</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="bank">Bank</option>
                </select>
            </div>
            <button onclick="savePurchase()" style="margin-top:6px;">Save Purchase</button>
        </div>
    </main>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('purchase-add');

let items = [];
let lineCount = 0;

async function init() {
    items = await api('/items');
    // No default line - purely opt-in via "+ Add Line", per the requested change.
}

function addLine() {
    const emptyRow = document.getElementById('emptyLinesRow');
    if (emptyRow) emptyRow.remove();

    const id = lineCount++;
    const row = document.createElement('tr');
    row.id = `line-${id}`;
    row.innerHTML = `
        <td>
            <div class="item-search-wrap" style="min-width:160px;">
                <input id="item-search-${id}" placeholder="Search item..." autocomplete="off"
                       oninput="renderLineSearchResults(${id})">
                <div class="item-search-results" id="item-results-${id}" style="display:none;"></div>
            </div>
        </td>
        <td><input type="number" id="qty-${id}" style="width:70px" value="1" oninput="recalc()"></td>
        <td><input type="number" step="0.01" id="cost-${id}" style="width:90px" value="0" oninput="recalc()"></td>
        <td><input type="number" step="0.01" id="sp-${id}" style="width:90px" value="0"></td>
        <td><input id="ref-${id}" placeholder="auto if blank" style="width:110px"></td>
        <td><input type="date" id="exp-${id}"></td>
        <td><button class="danger" onclick="removeLine(${id})">X</button></td>
    `;
    document.getElementById('linesBody').prepend(row);
    recalc();
}

function renderLineSearchResults(id) {
    const input = document.getElementById(`item-search-${id}`);
    const query = input.value.trim().toLowerCase();
    const box = document.getElementById(`item-results-${id}`);
    input.dataset.itemId = ''; // typing invalidates any previously selected item

    if (!query) { box.style.display = 'none'; return; }

    const matches = items.filter(i =>
        i.name.toLowerCase().includes(query) || (i.sku && i.sku.toLowerCase().includes(query))
    );

    if (matches.length === 0) {
        box.innerHTML = `<div class="item-search-not-found">Item not found</div>`;
    } else {
        box.innerHTML = matches.map(i => `
            <div class="item-search-row" onclick="selectLineItem(${id}, ${i.item_id})">
                ${i.name} <span class="stock-hint">${i.sku ? '(' + i.sku + ')' : ''} - Qty: ${i.total_stock}</span>
            </div>
        `).join('');
    }
    box.style.display = 'block';
}

function selectLineItem(id, itemId) {
    const item = items.find(i => i.item_id === itemId);
    const input = document.getElementById(`item-search-${id}`);
    input.value = item.name;
    input.dataset.itemId = itemId;
    document.getElementById(`item-results-${id}`).style.display = 'none';
}

function removeLine(id) {
    const row = document.getElementById(`line-${id}`);
    if (row) row.remove();
    if (document.querySelectorAll('[id^="line-"]').length === 0) {
        document.getElementById('linesBody').innerHTML =
            '<tr id="emptyLinesRow"><td colspan="7"><div class="empty-state">No lines yet - click "+ Add Line" to start.</div></td></tr>';
    }
    recalc();
}

function recalc() {
    let subtotal = 0;
    document.querySelectorAll('[id^="line-"]').forEach(row => {
        const id = row.id.split('-')[1];
        const qty = Number(document.getElementById(`qty-${id}`).value) || 0;
        const cost = Number(document.getElementById(`cost-${id}`).value) || 0;
        subtotal += qty * cost;
    });
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
}

async function savePurchase() {
    const supplier = document.getElementById('supplier').value.trim() || 'General Supplier';
    const status = document.getElementById('status').value;
    const amount_paid = Number(document.getElementById('amountPaid').value) || 0;
    const paymentMethodValue = document.getElementById('paymentMethod').value;
    const payment_method = paymentMethodValue || null;

    const lines = [];
    let hasUnselectedItem = false;
    document.querySelectorAll('[id^="line-"]').forEach(row => {
        const id = row.id.split('-')[1];
        const itemIdRaw = document.getElementById(`item-search-${id}`).dataset.itemId;
        if (!itemIdRaw) { hasUnselectedItem = true; return; }
        lines.push({
            item_id: Number(itemIdRaw),
            qty: Number(document.getElementById(`qty-${id}`).value),
            cost_price: Number(document.getElementById(`cost-${id}`).value),
            selling_price: Number(document.getElementById(`sp-${id}`).value),
            batch_ref_no: document.getElementById(`ref-${id}`).value.trim(),
            expiry_date: document.getElementById(`exp-${id}`).value || null,
        });
    });

    if (hasUnselectedItem) return toast('Pick an item from the search results for every line');
    if (lines.length === 0) return toast('Add at least one line');
    if (amount_paid > 0 && !payment_method) return toast('Select a payment method for the amount paid');

    try {
        await api('/purchases', {
            method: 'POST',
            body: JSON.stringify({ supplier, status, amount_paid, payment_method, lines }),
        });
        toast(status === 'received' ? 'Purchase saved - stock updated' : 'Purchase order recorded (LPO)');
        window.location.href = 'purchase.html';
    } catch (err) {
        toast(err.message);
    }
}

init();

// Hide a line's search results when clicking elsewhere on the page
document.addEventListener('click', (e) => {
    document.querySelectorAll('.item-search-wrap').forEach(wrap => {
        if (!wrap.contains(e.target)) {
            const results = wrap.querySelector('.item-search-results');
            if (results) results.style.display = 'none';
        }
    });
});
</script>
</body>
</html>
