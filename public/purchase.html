<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase List - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">

        <div class="list-filter-bar">
            <div class="field">
                <label>Search</label>
                <input id="filterSupplier" placeholder="Search supplier name or invoice no..." oninput="applyFilters()">
            </div>
            <div class="field">
                <label>From</label>
                <input type="date" id="filterFrom" oninput="applyFilters()">
            </div>
            <div class="field">
                <label>To</label>
                <input type="date" id="filterTo" oninput="applyFilters()">
            </div>
            <button class="secondary" onclick="clearFilters()">Clear</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Invoice No.</th><th>Date</th><th>Supplier</th><th>Status</th><th>Total</th>
                    <th>Paid</th><th>Balance</th><th>Payment</th><th>Created By</th><th></th>
                </tr>
            </thead>
            <tbody id="purchasesBody"></tbody>
        </table>
    </main>
</div>

<div id="payModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(15,20,28,0.5);">
    <div class="card" style="max-width:400px; margin:100px auto;">
        <h2 class="section-title">Record Payment</h2>
        <p style="font-size:13px; color:var(--text-muted); margin-top:-6px;">Balance due: <span class="mono" id="payBalance"></span></p>
        <div class="form-row">
            <label>Amount</label><input id="payAmount" type="number" step="0.01" style="width:140px;">
        </div>
        <div class="form-row">
            <label>Method</label>
            <select id="payMethod">
                <option value="cash">Cash</option>
                <option value="mpesa">M-Pesa</option>
                <option value="bank">Bank</option>
            </select>
        </div>
        <button onclick="submitPayment()">Save Payment</button>
        <button class="secondary" onclick="closePayModal()">Cancel</button>
    </div>
</div>

<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('purchase-list');

let purchases = [];
let payTargetId = null;

async function loadPurchases() {
    purchases = await api('/purchases');
    applyFilters();
}

function applyFilters() {
    const query = document.getElementById('filterSupplier').value.trim().toLowerCase();
    const from = document.getElementById('filterFrom').value;
    const to = document.getElementById('filterTo').value;

    const filtered = purchases.filter(p => {
        if (query) {
            const matchesSupplier = (p.supplier || '').toLowerCase().includes(query);
            const matchesInvoice = (p.purchase_invoice_no || '').toLowerCase().includes(query);
            if (!matchesSupplier && !matchesInvoice) return false;
        }
        const purchaseDate = p.purchase_date.substring(0, 10);
        if (from && purchaseDate < from) return false;
        if (to && purchaseDate > to) return false;
        return true;
    });

    renderPurchases(filtered);
}

function clearFilters() {
    document.getElementById('filterSupplier').value = '';
    document.getElementById('filterFrom').value = '';
    document.getElementById('filterTo').value = '';
    applyFilters();
}

function renderPurchases(list) {
    const body = document.getElementById('purchasesBody');
    if (list.length === 0) {
        body.innerHTML = `<tr><td colspan="10"><div class="empty-state">No purchases match these filters.</div></td></tr>`;
        return;
    }
    body.innerHTML = list.map(p => `
        <tr>
            <td class="mono">${p.purchase_invoice_no || '-'}</td>
            <td class="mono">${new Date(p.purchase_date).toLocaleDateString()}</td>
            <td>${p.supplier || '-'}</td>
            <td><span class="badge ${p.status}">${p.status === 'lpo' ? 'LPO' : 'Received'}</span></td>
            <td class="mono">${p.total}</td>
            <td class="mono">${p.amount_paid}</td>
            <td class="mono">${p.balance}</td>
            <td><span class="badge ${p.payment_status}">${p.payment_status}</span></td>
            <td>${p.created_by || '-'}</td>
            <td>
                <button class="secondary" onclick="location.href='purchase-view.html?id=${p.purchase_id}'">View</button>
                ${p.status === 'lpo' ? `<button onclick="receiveStock(${p.purchase_id})">Receive Stock</button>` : ''}
                ${p.payment_status !== 'paid' ? `<button onclick="openPayModal(${p.purchase_id}, ${p.balance})">Pay Now</button>` : ''}
            </td>
        </tr>
    `).join('');
}

async function receiveStock(id) {
    if (!confirm('Mark this purchase as received? This will create stock batches for every ordered line.')) return;
    try {
        await api(`/purchases/${id}/receive`, { method: 'POST' });
        toast('Stock received');
        loadPurchases();
    } catch (err) {
        toast(err.message);
    }
}

function openPayModal(id, balance) {
    payTargetId = id;
    document.getElementById('payBalance').textContent = balance;
    document.getElementById('payAmount').value = balance;
    document.getElementById('payModal').style.display = 'block';
}

function closePayModal() {
    document.getElementById('payModal').style.display = 'none';
    payTargetId = null;
}

async function submitPayment() {
    const amount = Number(document.getElementById('payAmount').value);
    const payment_method = document.getElementById('payMethod').value;
    if (!amount || amount <= 0) return toast('Enter a valid amount');
    try {
        await api(`/purchases/${payTargetId}/pay`, {
            method: 'POST',
            body: JSON.stringify({ amount, payment_method }),
        });
        toast('Payment recorded');
        closePayModal();
        loadPurchases();
    } catch (err) {
        toast(err.message);
    }
}

loadPurchases();
</script>
</body>
</html>
