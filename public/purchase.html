<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Purchase - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>
    <main class="content">
        <h1>Record Purchase</h1>

        <div class="card">
            <div class="form-row">
                <label>Supplier</label><input id="supplier" placeholder="optional">
            </div>
            <div class="form-row">
                <label>Discount</label><input id="discount" type="number" step="0.01" value="0" style="width:100px">
            </div>
        </div>

        <div class="card">
            <h2 class="section-title">Purchase Lines</h2>
            <table>
                <thead>
                    <tr>
                        <th>Item</th><th>Qty</th><th>Cost Price</th><th>Selling Price</th>
                        <th>Batch Ref No.</th><th>Expiry Date</th><th></th>
                    </tr>
                </thead>
                <tbody id="linesBody"></tbody>
            </table>
            <button class="secondary" onclick="addLine()" style="margin-top:12px;">+ Add Line</button>
        </div>

        <div class="card">
            <strong>Subtotal: <span class="mono" id="subtotal">0.00</span></strong>
            <br><br>
            <button onclick="savePurchase()">Save Purchase</button>
        </div>
    </main>
</div>
<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('purchase');

let items = [];
let lineCount = 0;

async function init() {
    items = await api('/items');
    addLine();
}

function itemOptions(selectedId) {
    return items.map(i => `<option value="${i.item_id}" ${i.item_id == selectedId ? 'selected' : ''}>${i.name}</option>`).join('');
}

function addLine() {
    const id = lineCount++;
    const row = document.createElement('tr');
    row.id = `line-${id}`;
    row.innerHTML = `
        <td><select id="item-${id}">${itemOptions()}</select></td>
        <td><input type="number" id="qty-${id}" style="width:70px" value="1" oninput="recalc()"></td>
        <td><input type="number" step="0.01" id="cost-${id}" style="width:90px" value="0" oninput="recalc()"></td>
        <td><input type="number" step="0.01" id="sp-${id}" style="width:90px" value="0"></td>
        <td><input id="ref-${id}" placeholder="auto if blank" style="width:110px"></td>
        <td><input type="date" id="exp-${id}"></td>
        <td><button class="danger" onclick="removeLine(${id})">X</button></td>
    `;
    document.getElementById('linesBody').appendChild(row);
    recalc();
}

function removeLine(id) {
    const row = document.getElementById(`line-${id}`);
    if (row) row.remove();
    recalc();
}

function recalc() {
    let subtotal = 0;
    document.querySelectorAll('[id^="line-"]').forEach(row => {
        const id = row.id.split('-')[1];
        const qty = Number(document.getElementById(`qty-${id}`).value) || 0;
        const cost = Number(document.getElementById(`cost-${id}`).value) || 0;
        subtotal += qty * cost;
    });
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
}

async function savePurchase() {
    const supplier = document.getElementById('supplier').value.trim();
    const discount = Number(document.getElementById('discount').value) || 0;

    const lines = [];
    document.querySelectorAll('[id^="line-"]').forEach(row => {
        const id = row.id.split('-')[1];
        lines.push({
            item_id: Number(document.getElementById(`item-${id}`).value),
            qty: Number(document.getElementById(`qty-${id}`).value),
            cost_price: Number(document.getElementById(`cost-${id}`).value),
            selling_price: Number(document.getElementById(`sp-${id}`).value),
            batch_ref_no: document.getElementById(`ref-${id}`).value.trim(),
            expiry_date: document.getElementById(`exp-${id}`).value || null,
        });
    });

    if (lines.length === 0) return toast('Add at least one line');

    try {
        await api('/purchases', { method: 'POST', body: JSON.stringify({ supplier, discount, lines }) });
        toast('Purchase saved - batches created');
        document.getElementById('linesBody').innerHTML = '';
        lineCount = 0;
        addLine();
    } catch (err) {
        toast(err.message);
    }
}

init();
</script>
</body>
</html>
