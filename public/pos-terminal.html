<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>POS Terminal - POS Batch System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <div id="sidebarMount"></div>

    <div class="pos-shell" style="flex:1;">
        <div class="pos-main">
            <div class="pos-topbar">
                <div class="date" id="todayDate"></div>
                <div class="pos-customer">
                    <label style="font-size:13px; color:var(--text-muted);">Customer</label>
                    <input id="customerName" value="Walk-in Customer">
                </div>
            </div>
            <div class="pos-tiles-wrap">
                <div class="pos-search">
                    <input id="itemSearch" placeholder="Search by item name or barcode/SKU..." oninput="renderTiles()">
                </div>
                <div class="tile-grid" id="tileGrid"></div>
            </div>
        </div>

        <div class="pos-cart">
            <div class="pos-cart-header">
                <span>Cart</span>
                <button class="cart-clear-btn" title="Clear cart" onclick="clearCart()">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>
                </button>
            </div>
            <div class="pos-cart-list" id="cartList"></div>
            <div class="pos-cart-footer">
                <div class="pos-total-row">
                    <span>Total</span>
                    <span class="mono" id="cartTotal">0.00</span>
                </div>
                <button style="width:100%;" onclick="openPayment()">Payment</button>
            </div>
        </div>
    </div>
</div>

<!-- Batch picker (F2) -->
<div class="batch-picker-overlay" id="batchPickerOverlay">
    <div class="batch-picker-panel">
        <h2 class="section-title">Choose a Batch <span style="font-weight:400; color:var(--text-muted); font-size:12px;">(F2)</span></h2>
        <table>
            <thead><tr><th>Ref No.</th><th>Expiry</th><th>Remaining</th><th>Price</th><th></th></tr></thead>
            <tbody id="batchPickerBody"></tbody>
        </table>
        <button class="secondary" onclick="closeBatchPicker()" style="margin-top:12px;">Cancel</button>
    </div>
</div>

<!-- Payment panel -->
<div class="payment-overlay" id="paymentOverlay">
    <div class="payment-panel">
        <h2 class="section-title">Payment</h2>
        <div class="payment-method-row">
            <label>Cash</label><input type="number" step="0.01" id="payCash" value="0" oninput="updatePaymentSummary()">
        </div>
        <div class="payment-method-row">
            <label>M-Pesa</label><input type="number" step="0.01" id="payMpesa" value="0" oninput="updatePaymentSummary()">
        </div>
        <div class="payment-method-row">
            <label>Bank</label><input type="number" step="0.01" id="payBank" value="0" oninput="updatePaymentSummary()">
        </div>
        <div class="payment-summary">
            <div><span>Grand Total</span><span class="mono" id="paySummaryTotal">0.00</span></div>
            <div><span>Amount Entered</span><span class="mono" id="paySummaryEntered">0.00</span></div>
            <div><span>Balance</span><span class="mono" id="paySummaryBalance">0.00</span></div>
        </div>
        <button style="width:100%; margin-bottom:8px;" onclick="completeSale()">Complete Sale</button>
        <button class="secondary" style="width:100%;" onclick="closePayment()">Close</button>
    </div>
</div>

<div id="toast"></div>
<script src="js/common.js"></script>
<script>
renderSidebar('pos-terminal');

document.getElementById('todayDate').textContent = new Date().toLocaleDateString(undefined, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
});

let items = [];
let cart = []; // { cart_key, item_id, item_name, qty, mode, batch_id, batch_ref_no, unit_price }
let cartKeyCounter = 0;
let activeCartKey = null;

async function init() {
    items = await api('/items');
    renderTiles();
}

function renderTiles() {
    const query = document.getElementById('itemSearch').value.trim().toLowerCase();
    const filtered = !query ? items : items.filter(i =>
        i.name.toLowerCase().includes(query) || (i.sku && i.sku.toLowerCase().includes(query))
    );

    const grid = document.getElementById('tileGrid');
    if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">No items match "${query}"</div>`;
        return;
    }
    grid.innerHTML = filtered.map(item => {
        const inStock = Number(item.total_stock) > 0;
        const initials = item.name.trim().slice(0, 2).toUpperCase();
        return `
        <div class="item-tile ${inStock ? '' : 'out-of-stock'}" onclick="${inStock ? `tileClicked(${item.item_id})` : ''}">
            <div class="tile-icon ${inStock ? 'in-stock' : 'out-stock'}">${initials}</div>
            <div class="tile-name">${item.name}</div>
            <div class="tile-price mono">Qty: ${item.total_stock}</div>
            <div class="tile-stock-label ${inStock ? 'in-stock' : 'out-stock'}">${inStock ? 'In Stock' : 'Out of Stock'}</div>
        </div>`;
    }).join('');
}

// Walks the available batches for an item oldest-first (same order the
// backend's FIFO allocator uses) and totals the cost for the requested qty,
// spilling into the next batch automatically once one runs out - so the cart
// total stays accurate even when a line's qty crosses a batch boundary.
async function computeFifoPricing(itemId, qty) {
    const batches = await api(`/sales/available-batches/${itemId}`);
    let remaining = qty;
    let totalCost = 0;
    let batchesUsed = [];
    for (const b of batches) {
        if (remaining <= 0) break;
        const take = Math.min(remaining, Number(b.qty_remaining));
        if (take <= 0) continue;
        totalCost += take * Number(b.selling_price);
        batchesUsed.push(b.batch_ref_no);
        remaining -= take;
    }
    return {
        totalCost,
        unitPrice: qty > 0 ? totalCost / qty : 0,
        batchLabel: batchesUsed.length === 0 ? 'No stock'
            : batchesUsed.length === 1 ? batchesUsed[0]
            : `${batchesUsed[0]} + ${batchesUsed.length - 1} more`,
        fullyCovered: remaining <= 0,
    };
}

async function tileClicked(itemId) {
    const item = items.find(i => i.item_id === itemId);

    const existing = cart.find(l => l.item_id === itemId && l.mode === 'fifo');
    if (existing) {
        existing.qty += 1;
        await refreshFifoLine(existing);
        renderCart();
        return;
    }

    const pricing = await computeFifoPricing(itemId, 1);
    if (!pricing.fullyCovered && pricing.totalCost === 0) return toast('No stock available for this item');

    cart.push({
        cart_key: cartKeyCounter++,
        item_id: itemId,
        item_name: item.name,
        qty: 1,
        mode: 'fifo',
        batch_id: null,
        batch_ref_no: pricing.batchLabel,
        unit_price: pricing.unitPrice,
    });
    renderCart();
}

// Recomputes price/batch label for a FIFO-mode line after its qty changes -
// this is what makes it "automatically open the next batch" once qty exceeds
// what the first batch has left.
async function refreshFifoLine(line) {
    if (line.mode !== 'fifo') return;
    const pricing = await computeFifoPricing(line.item_id, line.qty);
    line.unit_price = pricing.unitPrice;
    line.batch_ref_no = pricing.batchLabel;
}

function renderCart() {
    const list = document.getElementById('cartList');
    if (cart.length === 0) {
        list.innerHTML = `<div class="empty-state">Tap an item to add it</div>`;
    } else {
        list.innerHTML = cart.map(line => `
            <div class="cart-line ${line.cart_key === activeCartKey ? 'active' : ''}" onclick="setActiveCartLine(${line.cart_key})">
                <div class="cart-line-top">${line.item_name}</div>
                <div class="cart-line-meta">
                    <div class="qty-stepper">
                        <button onclick="event.stopPropagation(); adjustQty(${line.cart_key}, -1)">-</button>
                        <input class="mono" type="number" min="1" value="${line.qty}"
                               onclick="event.stopPropagation();"
                               onchange="event.stopPropagation(); setQty(${line.cart_key}, this.value)">
                        <button onclick="event.stopPropagation(); adjustQty(${line.cart_key}, 1)">+</button>
                    </div>
                    <span class="cart-line-total mono">Ksh ${(line.qty * line.unit_price).toFixed(2)}</span>
                    <span class="cart-line-x" onclick="event.stopPropagation(); removeCartLine(${line.cart_key})">x</span>
                </div>
                <div class="cart-line-price">Unit price: Ksh ${line.unit_price.toFixed(2)}</div>
                <div class="cart-line-batch">Batch: ${line.batch_ref_no}${line.mode === 'manual' ? ' (manual - F2 to change)' : ' (auto - F2 to change)'}</div>
            </div>
        `).join('');
    }
    document.getElementById('cartTotal').textContent =
        cart.reduce((sum, l) => sum + l.qty * l.unit_price, 0).toFixed(2);
}

function setActiveCartLine(key) {
    activeCartKey = key;
    renderCart();
}

async function adjustQty(key, delta) {
    const line = cart.find(l => l.cart_key === key);
    line.qty = Math.max(1, line.qty + delta);
    await refreshFifoLine(line);
    renderCart();
}

async function setQty(key, value) {
    const line = cart.find(l => l.cart_key === key);
    const qty = Math.max(1, parseInt(value, 10) || 1);
    line.qty = qty;
    await refreshFifoLine(line);
    renderCart();
}

function removeCartLine(key) {
    cart = cart.filter(l => l.cart_key !== key);
    if (activeCartKey === key) activeCartKey = null;
    renderCart();
}

function clearCart() {
    if (cart.length === 0) return;
    if (!confirm('Clear all items from the cart?')) return;
    cart = [];
    activeCartKey = null;
    renderCart();
}

// ============ F2 batch picker ============
document.addEventListener('keydown', (e) => {
    if (e.key === 'F2') {
        e.preventDefault();
        if (activeCartKey === null) return toast('Click a cart line first, then press F2');
        openBatchPicker(activeCartKey);
    }
});

async function openBatchPicker(key) {
    const line = cart.find(l => l.cart_key === key);
    if (!line) return;
    const batches = await api(`/sales/available-batches/${line.item_id}`);
    const body = document.getElementById('batchPickerBody');
    body.innerHTML = batches.map(b => `
        <tr>
            <td class="mono">${b.batch_ref_no}</td>
            <td class="mono ${expiryClass(b.expiry_date)}">${b.expiry_date ? b.expiry_date.substring(0,10) : '-'}</td>
            <td class="mono">${b.qty_remaining}</td>
            <td class="mono">${b.selling_price}</td>
            <td><button onclick="pickBatchForActiveLine(${b.batch_id}, '${b.batch_ref_no}', ${b.selling_price})">Select</button></td>
        </tr>
    `).join('') || `<tr><td colspan="5"><div class="empty-state">No stock available</div></td></tr>`;
    document.getElementById('batchPickerOverlay').style.display = 'block';
}

function pickBatchForActiveLine(batchId, refNo, price) {
    const line = cart.find(l => l.cart_key === activeCartKey);
    line.mode = 'manual';
    line.batch_id = batchId;
    line.batch_ref_no = refNo;
    line.unit_price = Number(price);
    closeBatchPicker();
    renderCart();
}

function closeBatchPicker() {
    document.getElementById('batchPickerOverlay').style.display = 'none';
}

// ============ Payment ============
function openPayment() {
    if (cart.length === 0) return toast('Cart is empty');
    document.getElementById('payCash').value = 0;
    document.getElementById('payMpesa').value = 0;
    document.getElementById('payBank').value = 0;
    updatePaymentSummary();
    document.getElementById('paymentOverlay').style.display = 'block';
}

function closePayment() {
    document.getElementById('paymentOverlay').style.display = 'none';
}

function cartGrandTotal() {
    return cart.reduce((sum, l) => sum + l.qty * l.unit_price, 0);
}

function updatePaymentSummary() {
    const total = cartGrandTotal();
    const entered = (Number(document.getElementById('payCash').value) || 0)
        + (Number(document.getElementById('payMpesa').value) || 0)
        + (Number(document.getElementById('payBank').value) || 0);
    document.getElementById('paySummaryTotal').textContent = total.toFixed(2);
    document.getElementById('paySummaryEntered').textContent = entered.toFixed(2);
    document.getElementById('paySummaryBalance').textContent = (total - entered).toFixed(2);
}

async function completeSale() {
    const cash = Number(document.getElementById('payCash').value) || 0;
    const mpesa = Number(document.getElementById('payMpesa').value) || 0;
    const bank = Number(document.getElementById('payBank').value) || 0;
    const customer_name = document.getElementById('customerName').value.trim() || 'Walk-in Customer';

    const payments = [];
    if (cash > 0) payments.push({ method: 'cash', amount: cash });
    if (mpesa > 0) payments.push({ method: 'mpesa', amount: mpesa });
    if (bank > 0) payments.push({ method: 'bank', amount: bank });

    const payload = {
        customer_name,
        payments,
        cart: cart.map(l => ({ item_id: l.item_id, qty: l.qty, mode: l.mode, batch_id: l.batch_id })),
    };

    try {
        const result = await api('/sales', { method: 'POST', body: JSON.stringify(payload) });
        toast(`Sale ${result.sale.invoice_no} completed - total Ksh ${result.sale.total}`);
        cart = [];
        activeCartKey = null;
        renderCart();
        closePayment();
        document.getElementById('customerName').value = 'Walk-in Customer';
        init(); // refresh tiles - stock levels changed
    } catch (err) {
        toast(err.message);
    }
}

init();
renderCart();
</script>
</body>
</html>
